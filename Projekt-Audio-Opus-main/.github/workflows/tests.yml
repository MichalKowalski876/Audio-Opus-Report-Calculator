name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    # 22.04 ma stabilne nazwy bibliotek (24.04 zmieniło je w transzy "t64").
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        # 3.12 i 3.13 = wersje pilnowane (pewne wheels PySide6 na Linuksie).
        # 3.14 = środowisko deweloperskie; dopuszczamy błąd, dopóki na
        # Linuksie nie ma stabilnych wheeli dla cp314.
        python-version: ["3.12", "3.13", "3.14"]

    continue-on-error: ${{ matrix.python-version == '3.14' }}

    env:
      # Brak ekranu w CI - Qt renderuje "w pamięci".
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Zainstaluj biblioteki systemowe dla Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libfreetype6

      - name: Zainstaluj zależności
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Uruchom testy
        run: pytest -q
